<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body p-4">
             <h1 class="h2 mb-4">
               {{ isEditing ? 'Redigera citat' : 'Lägg till nytt citat' }}
             </h1>

          @if (isLoading) {
            <div class="text-center py-5">
              <div class="spinner-border" aria-hidden="true"></div>
                <output class="visually-hidden">Laddar citat...</output>
            </div>
          } @else {
            <form [formGroup]="quoteForm" (ngSubmit)="onSubmit()" novalidate>
              <!-- Quote text -->
              <div class="mb-3">
                <label for="text" class="form-label">Citat</label>

                <textarea id="text" class="form-control" formControlName="text" rows="5"
                          [class.is-invalid]="
                          quoteForm.controls.text.invalid &&
                          quoteForm.controls.text.touched">
                </textarea>

                <div class="invalid-feedback">
                  Citatet är obligatoriskt.
                </div>
              </div>

              <!-- Optional author -->
              <div class="mb-4">
                <label for="author" class="form-label">
                  Författare
                </label>

                <input id="author" type="text" class="form-control" formControlName="author"
                       [class.is-invalid]="
                       quoteForm.controls.author.invalid &&
                       quoteForm.controls.author.touched">

                <div class="form-text">
                  Frivilligt.
                </div>

                <div class="invalid-feedback">
                  Författaren får innehålla högst 100 tecken.
                </div>
              </div>

              @if (errorMessage) {
                <div class="alert alert-danger" role="alert">
                  {{ errorMessage }}
                </div>
              }

              <div class="d-flex flex-column-reverse flex-sm-row justify-content-end gap-2">
                <a class="btn btn-outline-secondary" routerLink="/quotes">
                  Avbryt
                </a>

                <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
                  <i class="fa-solid fa-floppy-disk me-2"></i>

                  @if (isSubmitting) {
                    Sparar...
                  } @else if (isEditing) {
                    Uppdatera citat
                  } @else {
                    Spara citat
                  }
                </button>
              </div>
            </form>
          }
        </div>
      </div>
    </div>
  </div>
</div>
