<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h2 mb-4">
            {{ isEditing ? 'Redigera bok' : 'Lägg till ny bok' }}
          </h1>

          <form [formGroup]="bookForm" (ngSubmit)="onSubmit()" novalidate>
            <!-- Title -->
            <div class="mb-3">
              <label for="title" class="form-label">Titel</label>
              <input id="title" type="text" class="form-control" formControlName="title"
                     [class.is-invalid]="
                     bookForm.controls.title.invalid &&
                     bookForm.controls.title.touched">

              <div class="invalid-feedback">
                Titel är obligatorisk och får innehålla högst 255 tecken.
              </div>
            </div>

            <!-- Author -->
            <div class="mb-3">
              <label for="author" class="form-label">Författare</label>
              <input id="author" type="text" class="form-control" formControlName="author"
                     [class.is-invalid]="
                     bookForm.controls.author.invalid &&
                     bookForm.controls.author.touched">

              <div class="invalid-feedback">
                Författare är obligatorisk och får innehålla högst 150 tecken.
              </div>
            </div>

            <div class="row">
              <!-- Genre -->
              <div class="col-12 col-md-6 mb-3">
                <label for="genre" class="form-label">Genre</label>
                <input id="genre" type="text" class="form-control" formControlName="genre"
                       [class.is-invalid]="
                       bookForm.controls.genre.invalid &&
                       bookForm.controls.genre.touched">

                <div class="invalid-feedback">
                  Genre får innehålla högst 100 tecken.
                </div>
              </div>

              <!-- Publication date -->
              <div class="col-12 col-md-6 mb-3">
                <label for="publicationDate" class="form-label">
                  Publiceringsdatum
                </label>
                <input id="publicationDate" type="date" class="form-control" formControlName="publicationDate"
                       [class.is-invalid]="
                       bookForm.controls.publicationDate.invalid &&
                       bookForm.controls.publicationDate.touched">

                <div class="invalid-feedback">
                  Publiceringsdatum är obligatoriskt.
                </div>
              </div>
            </div>

            <!-- Description -->
            <div class="mb-4">
              <label for="description" class="form-label">Beskrivning</label>
              <textarea id="description" class="form-control" formControlName="description" rows="4"></textarea>
            </div>

            @if (errorMessage) {
              <div class="alert alert-danger" role="alert">
                {{ errorMessage }}
              </div>
            }

            <div class="d-flex flex-column-reverse flex-sm-row justify-content-end gap-2">
              <a class="btn btn-outline-secondary" routerLink="/books">
                Avbryt
              </a>

              <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
                <i class="fa-solid fa-floppy-disk me-2"></i>
                {{ isSubmitting ? 'Sparar...' : 'Spara bok' }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
